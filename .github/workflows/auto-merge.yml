name: CI y merge automático

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr create --base main --head ${{ github.ref_name }} \
            --title "Auto-merge: ${{ github.ref_name }}" \
            --body "Automated PR by CI" || echo "PR already exists"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 8082 --directory src > /tmp/heat-dashboard-http.log 2>&1 &
          echo $! > /tmp/heat-dashboard-http.pid
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8082 > /dev/null 2>&1; then
              echo "Static site ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/heat-dashboard-http.log
          exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            evidence/screenshots/
            evidence/reports/
            evidence/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/heat-dashboard-http.pid ]; then
            kill "$(cat /tmp/heat-dashboard-http.pid)" || true
          fi

      - name: Merge Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head ${{ github.ref_name }} \
            --json number --jq '.[0].number')
          [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] || { echo "No PR"; exit 1; }
          gh pr merge "$PR_NUMBER" --squash
