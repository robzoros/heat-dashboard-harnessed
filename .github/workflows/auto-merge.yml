name: CI y merge automático

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR subject from issue or commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          BRANCH="${{ github.ref_name }}"

          # An issue is used only when it is referenced explicitly, never guessed:
          # branch names such as `HDH-13` are feature ids, not issue numbers.
          ISSUE_REF=""
          if [[ "$BRANCH" =~ issue[-_]?([0-9]+) ]]; then
            ISSUE_REF="${BASH_REMATCH[1]}"
          fi
          if [ -z "$ISSUE_REF" ]; then
            ISSUE_REF=$(git log --format=%B "origin/main..HEAD" 2>/dev/null \
              | grep -oE '#[0-9]+' | head -n 1 | tr -d '#' || true)
          fi

          PR_TITLE="Auto-merge: $BRANCH"
          PR_BODY="Automated PR by CI from branch \`$BRANCH\`."

          if [ -n "$ISSUE_REF" ]; then
            ISSUE_TITLE=$(gh issue view "$ISSUE_REF" --json title --jq '.title' 2>/dev/null || true)
            if [ -n "$ISSUE_TITLE" ]; then
              PR_TITLE="$ISSUE_TITLE (#$ISSUE_REF)"
              PR_BODY="Automated PR by CI from branch \`$BRANCH\`.

          Closes #$ISSUE_REF"
            else
              echo "Issue #$ISSUE_REF not found; falling back to the commit subject."
            fi
          fi

          if [ "$PR_TITLE" = "Auto-merge: $BRANCH" ]; then
            COMMIT_SUBJECT=$(git log -1 --format=%s 2>/dev/null || true)
            if [ -n "$COMMIT_SUBJECT" ]; then
              PR_TITLE="$COMMIT_SUBJECT"
              PR_BODY="Automated PR by CI from branch \`$BRANCH\`.

          Commit: $COMMIT_SUBJECT"
            fi
          fi

          {
            echo "title<<PR_EOF"
            echo "$PR_TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_BODY"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          gh pr create --base main --head ${{ github.ref_name }} \
            --title "$PR_TITLE" --body "$PR_BODY" || echo "PR already exists"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 8082 --directory src > /tmp/heat-dashboard-http.log 2>&1 &
          echo $! > /tmp/heat-dashboard-http.pid
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8082 > /dev/null 2>&1; then
              echo "Static site ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/heat-dashboard-http.log
          exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            evidence/screenshots/
            evidence/reports/
            evidence/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop static site
        if: always()
        run: |
          if [ -f /tmp/heat-dashboard-http.pid ]; then
            kill "$(cat /tmp/heat-dashboard-http.pid)" || true
          fi

      - name: Merge Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head ${{ github.ref_name }} \
            --json number --jq '.[0].number')
          [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] || { echo "No PR"; exit 1; }
          gh pr merge "$PR_NUMBER" --squash
