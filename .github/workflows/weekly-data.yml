name: Actualizar datos BGG y publicar Pages

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Mismo grupo que deploy-pages.yml: solo un despliegue de Pages a la vez.
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proxy/package.json

      - name: Install proxy dependencies
        run: npm install --prefix proxy --no-audit --no-fund

      - name: Generate static BGG data
        env:
          BGG_USER: ${{ secrets.BGG_USER }}
          BGG_PASS: ${{ secrets.BGG_PASS }}
          BGG_MAX_ATTEMPTS: 6
          BGG_RETRY_BASE_MS: 3000
          BGG_REQUEST_TIMEOUT_MS: 30000
        run: node proxy/scripts/generate-bgg-data.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

  deploy:
    # Job separado para que el artefacto esté indexado antes de desplegar
    # (mismo motivo que en deploy-pages.yml).
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
