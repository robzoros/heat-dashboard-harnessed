networks:
  game-net:
    driver: bridge

services:
  game-dashboard:
    build: .
    ports:
      - "8082:80"
    depends_on:
      - bgg-proxy
    networks:
      - game-net
    restart: unless-stopped

  bgg-proxy:
    build: ./proxy
    environment:
      - CHAMPIONSHIPS_DIR=/app/championships
    networks:
      - game-net
    restart: unless-stopped